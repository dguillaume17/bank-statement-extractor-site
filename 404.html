    <!-- "dev" is replaced by the build number at deployment (deploy-pages.yml), like the ?build=dev query strings below. -->
    <meta name="build-number" content="105" />
    <script>
        // Safari (iOS) may serve a stale index.html from its cache. If build.json announces another build,
        // reload with ?build=N: a new URL the browser has never cached. build.json is missing locally: nothing happens.
        (function () {
            var current = document.querySelector('meta[name="build-number"]').content;
            fetch('build.json?t=' + Date.now(), { cache: 'no-store' })
                .then(function (response) { return response.ok ? response.json() : null; })
                .then(function (build) {
                    if (!build || String(build.number) === current) return;
                    var url = new URL(location.href);
                    if (url.searchParams.get('build') === String(build.number)) return; // already retried, avoid a loop
                    url.searchParams.set('build', build.number);
                    location.replace(url.toString());
                })
                .catch(function () { });
        })();
    </script>
